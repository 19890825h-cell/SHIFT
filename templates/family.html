<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家族予定表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body class="family-page family-dashboard-page">
    <main class="family-layout dashboard-layout">
      <section class="family-live-panel" aria-label="時刻と天気">
        <article class="clock-card">
          <span>現在時刻</span>
          <strong id="currentClock">--:--</strong>
          <small id="currentDateLabel">Asia/Tokyo</small>
          <em id="familyUpdated">読み込み中</em>
        </article>

        <article class="weather-card">
          <div class="weather-header">
            <div>
              <span>沖縄県内の天気</span>
              <strong>那覇周辺</strong>
            </div>
            <small id="weatherUpdated">取得中</small>
          </div>
          <div id="weatherDays" class="weather-days"></div>
        </article>
      </section>

      <section id="emptyFamily" class="panel empty-family" hidden>
        <h2>勤務表がまだありません</h2>
        <p>管理画面でPDFを読み取ると、ここに最新の予定が表示されます。</p>
      </section>

      <section id="familyMembers" class="family-members"></section>
    </main>

    <script src="{{ url_for('static', filename='family.js') }}"></script>
  </body>
</html>
