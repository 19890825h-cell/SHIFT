<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家族予定表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body class="family-page">
    <header class="app-header">
      <div>
        <p class="eyebrow">Family Schedule</p>
        <h1>家族予定表</h1>
      </div>
      <div class="auth-box">
        <span id="familyUpdated" class="badge">読み込み中</span>
        <a class="button secondary" href="/">管理画面</a>
      </div>
    </header>

    <main class="family-layout">
      <section id="emptyFamily" class="panel empty-family" hidden>
        <h2>勤務表がまだありません</h2>
        <p>管理画面でPDFを読み取ると、ここに最新の予定が表示されます。</p>
      </section>

      <section id="familyMembers" class="family-members"></section>
    </main>

    <script src="{{ url_for('static', filename='family.js') }}"></script>
  </body>
</html>
